[project]
name = "praxis-agent-service"
version = "0.0.1"
description = "Praxis 学习路线规划 Agent 服务：FastAPI + LangGraph 实现 clarify → plan → review 工作流，YAML 提示词驱动，LLM 结构化输出"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-deepseek>=0.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[tool.uv]
# 应用模式：uv sync 只把依赖装进 .venv，不构建/安装项目自身
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
