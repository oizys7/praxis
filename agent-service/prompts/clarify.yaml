# 澄清节点提示词：当规则检查发现输入信息不完整时使用
name: clarify
description: 基于检测到的信息缺口，生成友好的澄清问题

# 系统提示：约束 LLM 的角色与输出要求
system: |
  你是一位耐心的学习规划顾问。学习者提交的学习需求存在一些信息缺口。
  你的任务：针对这些缺口，生成多具体、友好的澄清问题。
  要求：
  - 每条问题只聚焦一个信息缺口，并简要说明为什么需要这个信息
  - 使用中文，语气友善、鼓励，不要让学习者感到被审问
  - 问题要能通过一句话回答

# 用户提示：注入学习者的原始请求与规则检查发现的问题
human: |
  学习者提交的信息如下（JSON）：
  {{request}}

  规则检查发现的信息缺口：
  {{issues}}

  请生成澄清问题。

# 降级文案：LLM 不可用（未配置 Key / 调用失败 / mock 模式）时按问题代码取用
fallback_questions:
  goal_too_short: "你的学习目标可以再具体一些吗？比如目标岗位、想达到的水平或时间期限。"
  weekly_hours_out_of_range: "你每周实际能投入多少小时学习？请填写 1-80 之间的数字。"
  weeks_out_of_range: "你希望在多少周内完成这次学习？请填写 1-52 之间的数字。"
  background_missing: "能简单介绍一下你目前已有的基础吗（学过什么、做过什么项目）？这能帮 Agent 校准起点。"
