<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- 预览边界：任何正文外链图片（含 srcset/picture）都不自动请求第三方；
         生产 index.html 无此限制，正常应用仍加载内容图片。 -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <title>Praxis · 本机预览</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/preview-bootstrap.js"></script>
  </body>
</html>
