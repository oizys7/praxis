[package]
name = "praxis"
version = "0.0.1"
description = "Praxis 学习路线规划 Agent 桌面端：Tauri 2 桌面壳，暴露 generate_plan / ping_agent IPC 命令，reqwest 转发本地 Agent 服务并统一错误归一"
license = "MIT"
edition = "2021"

# Tauri 2 构建脚本依赖：负责在编译期处理 tauri.conf.json、生成上下文等
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 核心库（桌面端无需额外 feature）
tauri = { version = "2", features = [] }
# 序列化：Rust 结构体 <-> JSON（与 Python/前端约定 camelCase）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP 客户端：Rust -> Python FastAPI 服务
# 本地通信走 http://127.0.0.1，不强制 TLS；保留默认 TLS 以兼容远程 Agent 服务
reqwest = { version = "0.12", features = ["json"] }
# 异步运行时（Tauri 自带 tokio，这里显式引入以便 reqwest/超时工作）
# process：sidecar 模式下用 tokio::process 拉起内置 Agent 子进程（仅 release 生效）
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
# 错误定义：为 AgentError 自动实现 std::error::Error / Display
thiserror = "2"
# 日志门面 + 订阅器（行格式与 Python 端 app/logging_config.py 契约对齐）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 日志时间戳：ISO 8601 本地时间（与 Python datetime.isoformat 对齐）
chrono = "0.4"
# 云端 PostgreSQL 持久化（学习计划历史）：纯 Rust 驱动，运行时查询
# json：plan_json JSONB 列经 sqlx::types::Json 编解码；v1 不启用 TLS（sslmode=disable）
# macros + migrate：#[sqlx::test] 集成测试（每用例建独立临时库）所需
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "chrono",
  "uuid",
  "json",
  "macros",
  "migrate",
] }
# 计划记录 id（uuid v4，Rust 端生成）
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
serde_yaml = "0.9"
# 目录推导：app_config.rs 在拿到 AppHandle 前复刻 Tauri app_data_dir（dirs::data_dir()/{identifier}），
# 与 tauri 内部同源（同一 dirs crate），避免手写各平台目录规则
dirs = "7"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

[profile.release]
# 减小产物体积的常见配置
codegen-units = 1
lto = true
strip = true
